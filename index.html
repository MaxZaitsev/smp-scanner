<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scan service QR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html,body{height:100%;margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--tg-theme-bg-color,#17212b);color:var(--tg-theme-text-color,#fff);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:1.5rem;box-sizing:border-box}
    h2{margin:.2rem 0 .6rem}
    p{opacity:.85;max-width:23rem;line-height:1.45;margin:.4rem 0 1.3rem}
    button{font-size:1.1rem;padding:.95rem 1.8rem;border:0;border-radius:12px;cursor:pointer;
      background:var(--tg-theme-button-color,#3390ec);color:var(--tg-theme-button-text-color,#fff)}
    button.secondary{background:transparent;color:var(--tg-theme-link-color,#6ab3f3);
      text-decoration:underline;padding:.6rem}
    #err{color:#ff6b6b;min-height:1.2rem;margin-top:1rem;font-size:.95rem}
  </style>
</head>
<body>
  <h2 id="title">📷 Service QR</h2>
  <p id="msg">Point your camera at the QR code shown on the car screen.</p>
  <button id="scan">Open scanner</button>
  <div id="err"></div>
  <script>
    var tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    var ru = (tg.initDataUnsafe && tg.initDataUnsafe.user &&
              (tg.initDataUnsafe.user.language_code || "").indexOf("ru") === 0);

    // The native QR popup is only implemented on the mobile apps. On Desktop / macOS /
    // Web the method exists but is unsupported, so the button would do nothing — detect
    // that and show a clear instruction instead of a dead button.
    var mobile = ["android", "ios"].indexOf(tg.platform) !== -1;
    var supported = mobile && typeof tg.showScanQrPopup === "function" &&
                    (!tg.isVersionAtLeast || tg.isVersionAtLeast("6.4"));

    var T = {
      title:   ru ? "📷 Сервисный QR" : "📷 Service QR",
      msg:     ru ? "Наведи камеру на QR-код на экране машины."
                  : "Point your camera at the QR code shown on the car screen.",
      open:    ru ? "Открыть сканер" : "Open scanner",
      nosup:   ru ? "📷 Сканер камеры работает только в мобильном Telegram (iOS/Android).\n\n"
                  + "Открой бота на телефоне — или вернись в чат и пришли фото QR "
                  + "либо вставь ссылку."
                  : "📷 The camera scanner works only in the mobile Telegram app "
                  + "(iOS/Android).\n\nOpen the bot on your phone — or go back to the "
                  + "chat and send a photo of the QR, or paste the link.",
      close:   ru ? "Закрыть" : "Close",
      hint:    ru ? "Сканируй сервисный QR" : "Scan the service QR",
      again:   ru ? "Сканировать ещё раз" : "Scan again",
      noread:  ru ? "Ничего не прочиталось. Мешают блики и наклон — держи телефон "
                  + "прямо перед экраном машины."
                  : "Nothing was read. Glare and a steep angle are the usual reasons — "
                  + "hold the phone straight in front of the car screen.",
      wrong:   ru ? "Это не сервисный QR — отправляю подсказку в чат…"
                  : "That isn't the Service Mode QR — sending you a hint in the chat…"
    };
    document.getElementById("title").textContent = T.title;
    document.getElementById("msg").textContent = T.msg;
    var btn = document.getElementById("scan");
    btn.textContent = T.open;

    function valid(t){
      if(!t) return null;
      var vin  = (t.match(/productId=([0-9A-Za-z]+)/) || [])[1];
      var asid = (t.match(/auth_session_id=([0-9A-Za-z-]+)/) || [])[1];
      return (vin && asid) ? t : null;
    }

    function showFallback(){
      document.getElementById("msg").textContent = T.nosup;
      btn.textContent = T.close;
      btn.onclick = function(){ tg.close(); };
    }

    // A scan that reads nothing leaves no trace anywhere, which is why failures used
    // to be invisible. Report every outcome to the bot so it can answer and be counted.
    var done = false, openedAt = 0;
    var NO_QR = "smp:noqr";

    function report(payload, note){
      if(done) return;
      done = true;
      if(note) document.getElementById("msg").textContent = note;
      try { tg.closeScanQrPopup(); } catch(e){}
      tg.sendData(payload);   // delivers to the bot and closes the Mini App
      tg.close();
    }

    function showNoRead(){
      if(done) return;
      document.getElementById("msg").textContent = T.noread;
      btn.textContent = T.again;
      btn.onclick = start;
    }

    // Fires when the user dismisses the scanner. If they actually tried for a while,
    // treat it as "couldn't read" and let the bot offer the photo route instead.
    try {
      tg.onEvent("scanQrPopupClosed", function(){
        if(done) return;
        if(openedAt && (window.performance.now() - openedAt) > 8000){
          report(NO_QR);
        } else {
          showNoRead();
        }
      });
    } catch(e){}

    function start(){
      document.getElementById("err").textContent = "";
      try {
        openedAt = window.performance.now();
        tg.showScanQrPopup({ text: T.hint }, function(text){
          var link = valid(text);
          if(link){
            report(link);
          } else {
            // Read something, but not ours. Send the raw text so the bot can explain
            // and so we can see what people are actually pointing the camera at.
            report(String(text || "").slice(0, 512), T.wrong);
          }
          return true;         // always close the scanner; silence was the bug
        });
      } catch(e) {
        showFallback();
      }
    }

    if(supported){
      btn.onclick = start;
      try { start(); } catch(e) { showFallback(); }   // auto-open where possible
    } else {
      showFallback();
    }
  </script>
</body>
</html>
